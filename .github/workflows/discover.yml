name: Discover region config (temporary)

on:
  workflow_dispatch:
  push:
    branches: [claude/eshop-us-mexico-canada-4nxb5o]
    paths: ['.github/workflows/discover.yml', 'scripts/discover.mjs']

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run discovery
        run: node scripts/discover.mjs
