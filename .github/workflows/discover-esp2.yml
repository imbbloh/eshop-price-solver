name: Discover eshop-prices.com SG/JP data (temp)
on:
  push:
    branches: [claude/esp-sg-jp-investigate]

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright playwright-extra puppeteer-extra-plugin-stealth
      - run: npx playwright install --with-deps chromium
      - run: node scripts/discover-esp3.mjs
