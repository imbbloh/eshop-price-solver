name: Discover JP feed freshness (temp)
on:
  push:
    branches: [claude/jp-feed-freshness-check]

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/discover-jp-freshness.mjs
