<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nintendo eShop — Price Solver</title>
<style>
  :root{
    --red:#e60012; --red-dark:#ff2d3f;
    --bg:#0e1013; --card:#171a20; --card2:#1f232b; --line:#2b303a;
    --ink:#e9edf3; --muted:#97a1af; --link:#6ea8ff; --green:#39c07b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  header{background:var(--red);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.4)}
  .head-in{max-width:760px;margin:0 auto;padding:16px 18px;display:flex;align-items:center;gap:12px}
  .logo{width:30px;height:30px;border-radius:8px;background:#fff;position:relative;flex:none}
  .logo:before{content:"";position:absolute;inset:6px;border-radius:50%;border:3px solid var(--red)}
  .head-in h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
  .wrap{max-width:760px;margin:0 auto;padding:18px;display:grid;gap:16px}

  /* region tabs */
  .tabs{display:flex;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px;flex-wrap:wrap}
  .tabs button{flex:1;min-width:80px;background:transparent;border:none;color:var(--muted);font-weight:700;font-size:16px;
    padding:12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .tabs button.active{background:var(--red);color:#fff}
  .flag{width:22px;height:22px;border-radius:50%;overflow:hidden;display:inline-flex;flex:none;line-height:0;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
  .flag svg{width:100%;height:100%;display:block}

  .sec-title{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin:2px 2px -2px}
  .sec-title .flag{width:26px;height:26px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
  input,select,textarea,button{font:inherit;color:var(--ink);background:var(--card2);
    border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
  input,select,textarea{width:100%}
  input:focus,select:focus{outline:none;border-color:var(--red)}
  textarea{min-height:88px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  button{cursor:pointer;background:var(--red);border-color:var(--red);color:#fff;font-weight:700;transition:.15s}
  button:hover{background:var(--red-dark);border-color:var(--red-dark)}
  button.ghost{background:var(--card2);color:var(--ink);border-color:var(--line);font-weight:600}
  button.ghost:hover{background:#262b34}
  button:disabled{opacity:.45;cursor:default}
  .btn-xl{width:100%;padding:18px;font-size:19px;border-radius:14px;box-shadow:0 4px 16px rgba(230,0,18,.3)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
  .row>*{flex:1;min-width:130px}
  .bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:12px}
  .bar>i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
  .muted{color:var(--muted)}.warn{color:#e0b13a}.err{color:#ff6b6b}.ok{color:var(--green)}
  #dstatus,#status{min-height:20px;font-size:13.5px;margin-top:10px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
  .hide{display:none}

  .sol{border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden;background:var(--card)}
  .sol .top{display:flex;justify-content:space-between;align-items:center;
    padding:11px 16px;background:var(--card2);border-bottom:1px solid var(--line)}
  .sol .top .n{color:var(--muted);font-weight:600;font-size:14px}
  .sol table{width:100%;border-collapse:collapse}
  .sol td{padding:11px 16px;border-top:1px solid var(--line)}
  .sol tbody tr:first-child td{border-top:none}
  .sol td.p{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .sol tfoot td{background:var(--card2);font-weight:800;border-top:2px solid var(--line)}
  .sol tfoot td.p{color:var(--green)}
  a{color:var(--link);text-decoration:none;font-weight:600}
  a:hover{text-decoration:underline}
  #moreBtn{width:100%;padding:13px;border-radius:12px}
  .soon{text-align:center;padding:30px 18px;color:var(--muted)}
  .soon .flag{width:56px;height:56px;margin:0 auto 8px}
</style>
</head>
<body>
<header><div class="head-in"><span class="logo"></span><h1>Nintendo eShop — Price Solver</h1></div></header>

<div class="wrap">

  <div class="tabs">
    <button id="tab-br" class="active" data-region="br"><span class="flag"><svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#009c3b"/><polygon points="12,3 22,12 12,21 2,12" fill="#ffdf00"/><circle cx="12" cy="12" r="4.6" fill="#002776"/></svg></span> Brazil</button>
    <button id="tab-us" data-region="us"><span class="flag"><svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#fff"/><g fill="#b22234"><rect width="24" height="1.85"/><rect y="3.69" width="24" height="1.85"/><rect y="7.38" width="24" height="1.85"/><rect y="11.08" width="24" height="1.85"/><rect y="14.77" width="24" height="1.85"/><rect y="18.46" width="24" height="1.85"/><rect y="22.15" width="24" height="1.85"/></g><rect width="10" height="12.9" fill="#3c3b6e"/></svg></span> United States</button>
    <button id="tab-ca" data-region="ca"><span class="flag"><svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#fff"/><rect width="6" height="24" fill="#d52b1e"/><rect x="18" width="6" height="24" fill="#d52b1e"/><polygon points="12,5 13.2,9 17,8 14.8,11 17.5,13 14,13.5 14.5,17 12,14.7 9.5,17 10,13.5 6.5,13 9.2,11 7,8 10.8,9" fill="#d52b1e"/></svg></span> Canada</button>
    <button id="tab-mx" data-region="mx"><span class="flag"><svg viewBox="0 0 24 24"><rect width="8" height="24" fill="#006341"/><rect x="8" width="8" height="24" fill="#fff"/><rect x="16" width="8" height="24" fill="#ce1126"/><circle cx="12" cy="12" r="3" fill="#8b5a2b"/></svg></span> Mexico</button>
  </div>

  <div id="sectionTitle" class="sec-title"><span class="flag"></span> <span id="secLabel">Brazil</span></div>

  <!-- functional panel (shown for ready regions) -->
  <div id="panel">
    <div class="card">
      <div id="dataState" class="muted" style="margin-bottom:12px"></div>
      <button id="fetchBtn" class="btn-xl">Update Games</button>
      <div class="bar"><i id="bar"></i></div>
      <div id="dstatus" class="muted"></div>
      <div style="margin-top:8px"><button id="cancelBtn" class="ghost" disabled style="padding:7px 14px">Stop</button></div>
      <details style="margin-top:14px">
        <summary>Import / export &amp; offline copy</summary>
        <div style="margin-top:12px">
          <label>Load a JSON file</label>
          <input type="file" id="file" accept="application/json,.json">
          <label style="margin-top:10px">…or paste JSON</label>
          <textarea id="paste" placeholder='{"games":[{"title":"...","price":4.99,"url":"...","filters":["base"]}]}'></textarea>
          <div class="row" style="margin-top:10px">
            <button id="loadPaste" class="ghost">Load pasted</button>
            <button id="dl" class="ghost">Export JSON</button>
            <button id="clearData" class="ghost">Clear</button>
          </div>
          <div id="dataErr" class="err"></div>
        </div>
      </details>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="row" style="margin-bottom:16px">
        <div style="flex:2">
          <label id="targetLabel">Target value</label>
          <input id="target" value="5.05" inputmode="decimal">
        </div>
        <div>
          <label>Filter</label>
          <select id="tag"><option value="">all</option></select>
        </div>
      </div>
      <button id="solve" class="btn-xl">Solve</button>
      <div style="margin-top:8px"><button id="stop" class="ghost" disabled style="padding:7px 14px">Stop</button></div>
      <div id="status" class="muted"></div>
    </div>

    <div id="results" class="card" style="margin-top:16px"><span class="muted">Enter a target and tap Solve.</span></div>
  </div>

  <!-- coming-soon panel (shown for not-ready regions) -->
  <div id="soonPanel" class="card hide">
    <div class="soon">
      <div id="soonFlag" class="flag"></div>
      <h2 id="soonTitle" style="margin:10px 0 6px"></h2>
      <p>This store's solver isn't ready yet. Switch to a working region above.</p>
    </div>
  </div>

</div>

<script>
/* ============================ regions ============================ */
const FLAG_SVG={
  br:'<svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#009c3b"/><polygon points="12,3 22,12 12,21 2,12" fill="#ffdf00"/><circle cx="12" cy="12" r="4.6" fill="#002776"/></svg>',
  us:'<svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#fff"/><g fill="#b22234"><rect width="24" height="1.85"/><rect y="3.69" width="24" height="1.85"/><rect y="7.38" width="24" height="1.85"/><rect y="11.08" width="24" height="1.85"/><rect y="14.77" width="24" height="1.85"/><rect y="18.46" width="24" height="1.85"/><rect y="22.15" width="24" height="1.85"/></g><rect width="10" height="12.9" fill="#3c3b6e"/></svg>',
  ca:'<svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#fff"/><rect width="6" height="24" fill="#d52b1e"/><rect x="18" width="6" height="24" fill="#d52b1e"/><polygon points="12,5 13.2,9 17,8 14.8,11 17.5,13 14,13.5 14.5,17 12,14.7 9.5,17 10,13.5 6.5,13 9.2,11 7,8 10.8,9" fill="#d52b1e"/></svg>',
  mx:'<svg viewBox="0 0 24 24"><rect width="8" height="24" fill="#006341"/><rect x="8" width="8" height="24" fill="#fff"/><rect x="16" width="8" height="24" fill="#ce1126"/><circle cx="12" cy="12" r="3" fill="#8b5a2b"/></svg>',
};
const REGIONS = {
  br: {
    label:'Brazil', ready:true,
    currency:'R$ ', maxPrice:30, origin:'https://www.nintendo.com', defaultTarget:'5.05',
    algolia:{appId:'U3B6GR4UA3',apiKey:'a29c6927638bfd8cee23993e51e721c9',index:'store_game_pt_br_price_asc'},
    priceKey:'price.regPrice', facetKey:'topLevelFilters',
    getPrice:h=>h.price?h.price.regPrice:null,
    filters:[
      {tag:'base',facet:null},
      {tag:'conteudo_extra',facet:'Conteúdo extra'},
      {tag:'jogo_com_conteudo',facet:'Jogo com conteúdo extra'},
      {tag:'pacote_melhoria',facet:'Pacote de melhoria'},
      {tag:'promocoes',facet:'Promoções'},
      {tag:'versao_demo',facet:'Versão demo disponível'},
    ],
    storeKey:'eshopSolver_br',
  },
  us: {
    label:'United States', ready:true,
    currency:'US$ ', maxPrice:10, origin:'https://www.nintendo.com',
    algolia:{appId:'U3B6GR4UA3',apiKey:'a29c6927638bfd8cee23993e51e721c9',index:'store_game_en_us_price_asc'},
    priceKey:'price.regPrice', facetKey:'topLevelFilters',
    getPrice:h=>h.price?h.price.regPrice:null,
    filters:[
      {tag:'base',facet:null},
      {tag:'dlc',facet:'DLC'},
      {tag:'games_with_dlc',facet:'Games with DLC'},
      {tag:'upgrade_pack',facet:'Upgrade pack'},
      {tag:'deals',facet:'Deals'},
      {tag:'demo_available',facet:'Demo available'},
      {tag:'game_voucher',facet:'Game Voucher eligible'},
    ],
    storeKey:'eshopSolver_us',
  },
  ca: {
    label:'Canada', ready:true,
    currency:'CA$ ', maxPrice:10, origin:'https://www.nintendo.com',
    algolia:{appId:'U3B6GR4UA3',apiKey:'a29c6927638bfd8cee23993e51e721c9',index:'store_game_en_ca_price_asc'},
    priceKey:'price.regPrice', facetKey:'topLevelFilters',
    getPrice:h=>h.price?h.price.regPrice:null,
    filters:[
      {tag:'base',facet:null},
      {tag:'dlc',facet:'DLC'},
      {tag:'games_with_dlc',facet:'Games with DLC'},
      {tag:'upgrade_pack',facet:'Upgrade pack'},
      {tag:'deals',facet:'Deals'},
      {tag:'demo_available',facet:'Demo available'},
      {tag:'game_voucher',facet:'Game Voucher eligible'},
    ],
    storeKey:'eshopSolver_ca',
  },
  mx: {
    label:'Mexico', ready:true,
    currency:'MX$ ', maxPrice:250, origin:'https://www.nintendo.com',
    algolia:{appId:'U3B6GR4UA3',apiKey:'a29c6927638bfd8cee23993e51e721c9',index:'store_game_es_mx_price_asc'},
    priceKey:'price.regPrice', facetKey:'topLevelFilters',
    getPrice:h=>h.price?h.price.regPrice:null,
    filters:[
      {tag:'base',facet:null},
      {tag:'dlc',facet:'Contenido descargable'},
      {tag:'games_with_dlc',facet:'Juegos con contenido descargable'},
      {tag:'upgrade_pack',facet:'Pase de mejora'},
      {tag:'deals',facet:'Ofertas'},
      {tag:'demo_available',facet:'Demo disponible'},
      {tag:'game_voucher',facet:'Título elegible para cupones para juegos'},
    ],
    storeKey:'eshopSolver_mx',
  },
};
const CAP=980, EPS=0.0001, WANT=5, MAX_LEN=15;
// Max titles kept per unique price point — see harvest() below. US/CA in
// particular have far denser catalogs than BR and routinely blow past
// Algolia's 1000-hit-per-query cap at common price points like $4.99
// (3000+ titles); recovering all of them isn't worth the extra queries, so
// oversaturated price points are just sampled instead.
const PER_PRICE_CAP=10;

/* ============================ state ============================ */
let current='br';
const DATA={br:[],us:[],ca:[],mx:[]};          // per-region: {title, price(cents), url, filters[]}
let CANCEL_FETCH=false, CANCEL_SOLVE=false;
const $=s=>document.querySelector(s);
const R=()=>REGIONS[current];
const toCents=v=>Math.round(parseFloat(String(v).replace(/\s/g,'').replace(',','.'))*100);
const fmt=c=>R().currency+(c/100).toFixed(2);

/* ==================== scraping (in-browser) ==================== */
function endpoint(r){return `https://${r.algolia.appId}-dsn.algolia.net/1/indexes/${r.algolia.index}/query`;}
async function query(r,body){
  const res=await fetch(endpoint(r),{method:'POST',headers:{'x-algolia-api-key':r.algolia.apiKey,'x-algolia-application-id':r.algolia.appId,'content-type':'application/x-www-form-urlencoded'},body:JSON.stringify(body)});
  if(!res.ok) throw new Error('Store API HTTP '+res.status+' — the search key may have changed.');
  return res.json();
}
const rangeNF=(r,lo,hi)=>[r.priceKey+'>='+lo,r.priceKey+'<'+hi];
const facetOf=(r,f)=>f?r.facetKey+':"'+f+'"':undefined;
async function count(r,lo,hi,f){return (await query(r,{numericFilters:rangeNF(r,lo,hi),filters:facetOf(r,f),hitsPerPage:0})).nbHits;}

async function fetchWindow(r,filters,lo,hi,db,tag,hitsPerPage){
  const j=await query(r,{numericFilters:rangeNF(r,lo,hi),filters,hitsPerPage,page:0,attributesToRetrieve:['title','url','price','objectID']});
  const perPrice={};
  for(const h of j.hits){
    const reg=r.getPrice(h);
    if(h.objectID==null||reg==null||reg<=0||reg>r.maxPrice) continue;
    const key=reg.toFixed(2);
    perPrice[key]=(perPrice[key]||0)+1;
    if(perPrice[key]>PER_PRICE_CAP) continue;
    const cur=db[h.objectID]||{title:h.title,price:Math.round(reg*100),url:r.origin+(h.url||''),filters:[]};
    if(!cur.filters.includes(tag)) cur.filters.push(tag);
    db[h.objectID]=cur;
  }
  return j.hits.length;
}

async function harvest(r,facet,tag,db,onProg){
  let lo=0;
  while(lo<=r.maxPrice){
    if(CANCEL_FETCH) throw new Error('cancelled');
    let hi=Math.min(lo+2,r.maxPrice+EPS);
    let c=await count(r,lo,hi,facet);
    while(c>=CAP && (hi-lo)>0.005){ hi=lo+(hi-lo)/2; c=await count(r,lo,hi,facet); }
    // At the halving floor (~0.005 wide) a window holds essentially one price
    // point, so if it's still oversaturated a small hitsPerPage already gets
    // us our sample — no need to keep querying for the rest.
    const hitsPerPage=c>=CAP?PER_PRICE_CAP*3:1000;
    await fetchWindow(r,facetOf(r,facet),lo,hi,db,tag,hitsPerPage);
    lo=hi;
    if(onProg) onProg(Math.min(lo,r.maxPrice));
  }
}

async function fetchAll(){
  const r=R(); if(!r.ready) return;
  CANCEL_FETCH=false;
  $('#fetchBtn').disabled=true; $('#cancelBtn').disabled=false;
  const db={};
  try{
    for(let i=0;i<r.filters.length;i++){
      const f=r.filters[i];
      await harvest(r,f.facet,f.tag,db,(p)=>{
        const frac=(i+p/r.maxPrice)/r.filters.length;
        $('#bar').style.width=(frac*100).toFixed(1)+'%';
        $('#dstatus').innerHTML=`Fetching <b>${f.facet||'all games'}</b> … ${r.currency}${p.toFixed(2)} · ${Object.keys(db).length} games`;
      });
    }
    DATA[current]=Object.values(db).map(g=>({title:g.title,price:g.price,url:g.url,filters:g.filters}));
    persist(); refreshTags();
    $('#bar').style.width='100%';
    $('#dstatus').innerHTML=`<span class="ok">✓ Updated: ${DATA[current].length} games saved.</span>`;
    setDataState(Date.now());
  }catch(e){
    $('#dstatus').innerHTML = e.message==='cancelled'
      ? '<span class="warn">Stopped. Kept previously saved data.</span>'
      : '<span class="err">'+e.message+'</span>';
  }
  $('#fetchBtn').disabled=false; $('#cancelBtn').disabled=true;
}

/* ==================== persistence ==================== */
function persist(){ try{ localStorage.setItem(R().storeKey, JSON.stringify({savedAt:Date.now(), games:DATA[current].map(g=>({...g,price:g.price/100}))})); }catch(e){} }
function refreshTags(){
  const tags=new Set(); DATA[current].forEach(g=>(g.filters||[]).forEach(t=>tags.add(t)));
  const sel=$('#tag'); const prev=sel.value;
  sel.innerHTML='<option value="">all</option>'+[...tags].sort().map(t=>`<option>${t}</option>`).join('');
  sel.value=prev;
}
function setDataState(savedAt){
  if(!DATA[current].length){ $('#dataState').innerHTML='No data yet — tap below to fetch (~30–60s).'; return; }
  const when=savedAt?new Date(savedAt).toLocaleDateString():'this session';
  $('#dataState').innerHTML=`<span class="ok">●</span> <b>${DATA[current].length}</b> games loaded · updated ${when}`;
}
function ingest(payload){
  $('#dataErr').textContent='';
  let o; try{ o=typeof payload==='string'?JSON.parse(payload):payload; }catch(e){ $('#dataErr').textContent='Invalid JSON: '+e.message; return; }
  const arr=Array.isArray(o)?o:(o.games||o.data||[]); const clean=[]; const seen=new Set(); const cap=R().maxPrice*100;
  arr.forEach(g=>{
    const price=typeof g.price==='number'?Math.round(g.price*100):toCents(g.price);
    if(!g.title||!isFinite(price)||price<=0||price>cap) return;
    const k=(g.url||'')+'|'+g.title; if(seen.has(k)) return; seen.add(k);
    clean.push({title:String(g.title).trim(),price,url:g.url||'#',filters:g.filters||[]});
  });
  DATA[current]=clean; persist(); refreshTags(); setDataState(Date.now());
}
function loadStored(region){
  try{ const s=localStorage.getItem(REGIONS[region].storeKey); if(s){ const o=JSON.parse(s);
    DATA[region]=(o.games||[]).map(g=>({title:g.title,price:Math.round(g.price*100),url:g.url,filters:g.filters||[]}));
    return o.savedAt; } }catch(e){}
  return null;
}
function exportObj(){ return {savedAt:Date.now(),region:current,maxPrice:R().maxPrice,count:DATA[current].length,games:DATA[current].map(g=>({...g,price:g.price/100}))}; }

/* ==================== region switching ==================== */
const savedAts={};
function switchRegion(region){
  current=region;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.region===region));
  const r=REGIONS[region];
  $('#sectionTitle').querySelector('.flag').innerHTML=FLAG_SVG[region]||'';
  $('#secLabel').textContent=r.label;
  if(!r.ready){
    $('#panel').classList.add('hide'); $('#soonPanel').classList.remove('hide');
    $('#soonFlag').innerHTML=FLAG_SVG[region]||'';
    $('#soonTitle').textContent=r.label+' — coming soon';
    return;
  }
  $('#panel').classList.remove('hide'); $('#soonPanel').classList.add('hide');
  $('#targetLabel').textContent='Target value ('+r.currency.trim()+')';
  $('#target').value=r.defaultTarget||'';
  refreshTags(); setDataState(savedAts[region]);
  $('#results').innerHTML='<span class="muted">Enter a target and tap Solve.</span>';
  $('#status').textContent=''; $('#dstatus').textContent=''; $('#bar').style.width='0';
}

/* ==================== solver ==================== */
function solve(){
  const games=DATA[current];
  if(!games.length){ $('#status').innerHTML='<span class="err">No data — update games first.</span>'; return; }
  const target=toCents($('#target').value); const tag=$('#tag').value;
  if(!isFinite(target)||target<=0){ $('#status').innerHTML='<span class="err">Invalid target.</span>'; return; }
  const pool=games.filter(g=>(!tag||(g.filters||[]).includes(tag))&&g.price<=target).sort((a,b)=>a.price-b.price);
  const pre=[0]; for(let i=0;i<pool.length;i++) pre.push(pre[i]+pool[i].price);
  const results=[]; let nodes=0; const BUDGET=30_000_000; CANCEL_SOLVE=false;
  function searchLen(L){
    const path=[];
    (function dfs(i,sum,r){
      if(results.length>=WANT||nodes>BUDGET||CANCEL_SOLVE) return;
      if(r===0){ if(sum===target) results.push(path.slice()); return; }
      for(let k=i;k+r<=pool.length;k++){
        nodes++;
        const minSum=sum+(pre[k+r]-pre[k]);
        if(minSum>target) break;
        path.push(pool[k]); dfs(k+1,sum+pool[k].price,r-1); path.pop();
        if(results.length>=WANT) return;
      }
    })(0,0,L);
  }
  $('#status').textContent='Searching…'; $('#stop').disabled=false;
  setTimeout(()=>{
    const t0=performance.now();
    for(let L=1; L<=MAX_LEN && results.length<WANT && nodes<=BUDGET && !CANCEL_SOLVE; L++) searchLen(L);
    const ms=Math.round(performance.now()-t0);
    render(results);
    $('#status').innerHTML = results.length
      ? `Found ${results.length} combination${results.length>1?'s':''} in ${ms} ms.`
      : `No exact match in ${ms} ms — try another target or filter.`;
    $('#stop').disabled=true;
  },20);
}
function render(sols){
  const box=$('#results');
  if(!sols.length){ box.innerHTML='<span class="err">No combination adds up exactly to the target. Try another target or filter.</span>'; return; }
  const card=(s)=>{
    const sum=s.reduce((a,g)=>a+g.price,0);
    const rows=s.map(g=>`<tr><td><a href="${g.url}" target="_blank" rel="noopener">${esc(g.title)}</a></td><td class="p">${fmt(g.price)}</td></tr>`).join('');
    return `<div class="sol">
      <div class="top"><span class="n">${s.length} game${s.length>1?'s':''}</span></div>
      <table><tbody>${rows}</tbody><tfoot><tr><td>Total</td><td class="p">${fmt(sum)}</td></tr></tfoot></table>
    </div>`;
  };
  box.innerHTML = card(sols[0]) +
    `<div id="more" class="hide">${sols.slice(1).map(card).join('')}</div>` +
    (sols.length>1 ? `<button id="moreBtn" class="ghost">Show ${sols.length-1} more combination${sols.length-1>1?'s':''}</button>` : '');
  const mb=$('#moreBtn');
  if(mb) mb.onclick=()=>{ $('#more').classList.remove('hide'); mb.classList.add('hide'); };
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ==================== wiring ==================== */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchRegion(b.dataset.region));
$('#fetchBtn').onclick=fetchAll;
$('#cancelBtn').onclick=()=>{CANCEL_FETCH=true;};
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>ingest(r.result);r.readAsText(f);});
$('#loadPaste').onclick=()=>ingest($('#paste').value);
$('#clearData').onclick=()=>{try{localStorage.removeItem(R().storeKey);}catch(e){} DATA[current]=[];refreshTags();setDataState(null);$('#dstatus').textContent='Data cleared.';$('#results').innerHTML='<span class="muted">Enter a target and tap Solve.</span>';};
$('#dl').onclick=()=>{const b=new Blob([JSON.stringify(exportObj(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`nintendo-${current}-games.json`;document.body.appendChild(a);a.click();a.remove();};
$('#solve').onclick=solve;
$('#stop').onclick=()=>{CANCEL_SOLVE=true;};

/* ==================== init ==================== */
// Primary source: the shared data file committed in the repo (auto-refreshed by
// a GitHub Action). Every browser/device loads it — no per-device fetching.
async function loadShared(region){
  const r=REGIONS[region]; if(!r.ready) return null;
  try{
    const res=await fetch('./data/'+region+'.json?_='+Date.now(),{cache:'no-store'});
    if(res.ok){ const o=await res.json();
      DATA[region]=(o.games||[]).map(g=>({title:g.title,price:Math.round(g.price*100),url:g.url,filters:g.filters||[]}));
      return o.savedAt||null;
    }
  }catch(e){}
  return null;
}
(async function init(){
  for(const reg of Object.keys(REGIONS)){
    const sharedAt=await loadShared(reg);            // shared repo file first…
    savedAts[reg]= sharedAt || loadStored(reg);      // …else whatever this device saved
  }
  switchRegion('br');
})();
</script>
